<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Fitness Coach</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2B4D3E" />
<link rel="icon" href="icon-192.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap');
  body { margin:0; background:#E9E4D6; font-family:'Work Sans', sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

const C = {
  bg: "#FAF8F2", ink: "#1C1B17", inkSoft: "#6B6759",
  forest: "#2B4D3E", forestDark: "#1E362B",
  turmeric: "#D9A441", turmericDark: "#B8842F",
  card: "#F1EDE0", line: "#E1DBC8", alert: "#A23E36",
};
const FONT_HEAD = "'Archivo Black','Arial Black',sans-serif";
const FONT_BODY = "'Work Sans','Segoe UI',sans-serif";

const GOALS = [{id:"lose",label:"Lose weight"},{id:"gain",label:"Gain weight"},{id:"maintain",label:"Stay fit / maintain"}];
const ACTIVITY = [{id:"low",label:"Mostly sitting"},{id:"moderate",label:"On my feet, light activity"},{id:"high",label:"Train or work physically"}];
const DIET = [{id:"veg",label:"Vegetarian"},{id:"nonveg",label:"Non-vegetarian"},{id:"vegan",label:"Vegan"}];

function todayLabel(){ const d=new Date(); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
function to24Hour(t=""){ const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i); if(!m) return "08:00"; let [,h,min,ampm]=m; h=parseInt(h,10); if(/PM/i.test(ampm)&&h!==12)h+=12; if(/AM/i.test(ampm)&&h===12)h=0; return `${String(h).padStart(2,"0")}:${min}`; }
function to12Hour(t=""){ const [h,min]=t.split(":").map(Number); if(isNaN(h)) return t; const ampm=h>=12?"PM":"AM"; const hour12=h%12===0?12:h%12; return `${hour12}:${String(min).padStart(2,"0")} ${ampm}`; }

const EXERCISE_VISUALS = [
  {keys:["squat"],emoji:"🏋️",bg:"#E9D9B8"},{keys:["push"],emoji:"💪",bg:"#F0D9C8"},
  {keys:["plank"],emoji:"🧍",bg:"#DCE6DC"},{keys:["lunge"],emoji:"🦵",bg:"#E9D9B8"},
  {keys:["jump","jack","skip"],emoji:"🤸",bg:"#F0D9C8"},{keys:["run","sprint","cardio"],emoji:"🏃",bg:"#DCE6DC"},
  {keys:["walk"],emoji:"🚶",bg:"#DCE6DC"},{keys:["stretch","yoga","mobility"],emoji:"🧘",bg:"#EADFF0"},
  {keys:["crunch","situp","sit up","ab","core"],emoji:"🔥",bg:"#F0D9C8"},{keys:["curl","bicep"],emoji:"💪",bg:"#E9D9B8"},
  {keys:["deadlift","row"],emoji:"🏋️",bg:"#E9D9B8"},{keys:["pull up","pullup","chin up"],emoji:"🧗",bg:"#DCE6DC"},
  {keys:["shoulder","raise"],emoji:"🙆",bg:"#F0D9C8"},{keys:["cycle","bike"],emoji:"🚴",bg:"#DCE6DC"},{keys:["swim"],emoji:"🏊",bg:"#DCE6DC"},
];
function getExerciseVisual(name=""){ const lower=name.toLowerCase(); const m=EXERCISE_VISUALS.find(v=>v.keys.some(k=>lower.includes(k))); return m||{emoji:"🏋️",bg:C.card}; }

function ReminderToggle({on,onClick}){
  const w=34,h=20;
  return (
    <button onClick={onClick} style={{width:w,height:h,borderRadius:999,border:"none",background:on?C.forest:"#D8D2BE",position:"relative",cursor:"pointer",flexShrink:0}}>
      <span style={{position:"absolute",top:2,left:on?w-h+2:2,width:h-4,height:h-4,borderRadius:"50%",background:"#fff",transition:"left 0.15s ease",boxShadow:"0 1px 2px rgba(0,0,0,0.25)"}} />
    </button>
  );
}

function requestNotifyPermission(){
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}
function scheduleBrowserAlarm(label, time24){
  if (!("Notification" in window)) return;
  const [h,m] = time24.split(":").map(Number);
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  if (target < now) target.setDate(target.getDate()+1);
  const ms = target - now;
  setTimeout(() => {
    if (Notification.permission === "granted") new Notification(label, { body: "Time's up! " + label, icon: "icon-192.png" });
  }, ms);
}

function FitnessApp(){
  const [screen,setScreen]=useState("setup");
  const [tab,setTab]=useState("diet");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [plan,setPlan]=useState(null);
  const [weightLog,setWeightLog]=useState([]);
  const [newWeight,setNewWeight]=useState("");
  const [mealReminders,setMealReminders]=useState({});
  const [workoutReminders,setWorkoutReminders]=useState({});
  const [mealTimes,setMealTimes]=useState({});
  const [customReminders,setCustomReminders]=useState([]);

  const [form,setForm]=useState({name:"",age:"",gender:"female",height:"",weight:"",targetWeight:"",goal:"lose",activity:"moderate",diet:"veg"});
  function update(field,value){ setForm(f=>({...f,[field]:value})); }
  const canSubmit = form.age && form.height && form.weight && form.name.trim().length>0;

  function toggleMealReminder(name){
    setMealReminders(r=>{ const on=!r[name]; if(on){ requestNotifyPermission(); scheduleBrowserAlarm(name, mealTimes[name] || "08:00"); } return {...r,[name]:on}; });
  }
  function toggleWorkoutReminder(day){
    setWorkoutReminders(r=>{ const on=!r[day]; if(on){ requestNotifyPermission(); scheduleBrowserAlarm("Workout: "+day, "18:00"); } return {...r,[day]:on}; });
  }
  function updateMealTime(name,t){ setMealTimes(m=>({...m,[name]:t})); }
  function addCustomReminder(label,time24){
    if(!label.trim()||!time24) return;
    requestNotifyPermission();
    scheduleBrowserAlarm(label, time24);
    setCustomReminders(list=>[...list,{id:Date.now(),label:label.trim(),time:time24,on:true}]);
  }
  function toggleCustomReminder(id){ setCustomReminders(list=>list.map(r=>r.id===id?{...r,on:!r.on}:r)); }
  function removeCustomReminder(id){ setCustomReminders(list=>list.filter(r=>r.id!==id)); }

  async function generatePlan(){
    setLoading(true); setError("");
    const goalLabel=GOALS.find(g=>g.id===form.goal)?.label;
    const activityLabel=ACTIVITY.find(a=>a.id===form.activity)?.label;
    const dietLabel=DIET.find(d=>d.id===form.diet)?.label;
    const prompt = `Create a personalised fitness plan for an Indian user with these details:
Name: ${form.name}, Age: ${form.age}, Gender: ${form.gender}, Height: ${form.height} cm, Current weight: ${form.weight} kg, Target weight: ${form.targetWeight||"not specified"} kg.
Goal: ${goalLabel}. Activity level: ${activityLabel}. Diet preference: ${dietLabel}.
Important diet rule: "Vegetarian" means strict lacto-vegetarian - NO eggs anywhere. "Non-vegetarian" can include eggs/meat/fish. "Vegan" means no dairy, no eggs, no meat.

Reply with ONLY valid JSON, no markdown fences, matching exactly:
{"bmi":<number>,"bmiCategory":"<Underweight|Normal|Overweight|Obese>","dailyCalories":<int>,"macros":{"protein":<int>,"carbs":<int>,"fat":<int>},"meals":[{"name":"Breakfast","time":"7:30 AM","items":"<items>","calories":<int>},{"name":"Mid-morning snack","time":"10:30 AM","items":"<items>","calories":<int>},{"name":"Lunch","time":"1:00 PM","items":"<items>","calories":<int>},{"name":"Evening snack","time":"5:00 PM","items":"<items>","calories":<int>},{"name":"Dinner","time":"8:00 PM","items":"<items>","calories":<int>}],"workoutDays":[{"day":"Monday","focus":"<focus>","exercises":[{"name":"<ex>","sets":"<e.g. 3x12>"},{"name":"<ex>","sets":"<..>"},{"name":"<ex>","sets":"<..>"}]},{"day":"Tuesday","focus":"<focus>","exercises":[...3 items...]},{"day":"Wednesday","focus":"Rest or light cardio","exercises":[{"name":"Walk or stretch","sets":"20-30 min"}]},{"day":"Thursday","focus":"<focus>","exercises":[...3 items...]},{"day":"Friday","focus":"<focus>","exercises":[...3 items...]}],"tips":["<tip>","<tip>","<tip>"]}
Keep text short. Use simple Indian foods and basic exercises.`;
    try{
      const response = await fetch("/api/generate-plan", {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({prompt})
      });
      const data = await response.json();
      const text = (data.content||[]).map(b=>b.text||"").join("").trim();
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setPlan(parsed);
      setWeightLog([{date:todayLabel(),weight:parseFloat(form.weight)}]);
      setScreen("dashboard"); setTab("diet");
    }catch(e){
      setError("Plan generate nahi ho paaya. API key check karein ya dobara try karein.");
    }finally{ setLoading(false); }
  }
  function addWeightEntry(){
    const w=parseFloat(newWeight); if(!w||w<=0) return;
    setWeightLog(log=>[...log,{date:todayLabel(),weight:w}]); setNewWeight("");
  }

  return (
    <div style={{background:"#E9E4D6",fontFamily:FONT_BODY,minHeight:"100vh"}} className="flex items-center justify-center p-4">
      <div style={{width:390,maxWidth:"100%",minHeight:700,background:C.bg,borderRadius:28,overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 20px 50px rgba(28,27,23,0.3)"}}>
        {screen==="setup" ? (
          <SetupScreen form={form} update={update} canSubmit={canSubmit} loading={loading} error={error} onSubmit={generatePlan} />
        ) : (
          <DashboardScreen plan={plan} form={form} tab={tab} setTab={setTab} weightLog={weightLog} newWeight={newWeight} setNewWeight={setNewWeight} addWeightEntry={addWeightEntry}
            mealReminders={mealReminders} toggleMealReminder={toggleMealReminder} workoutReminders={workoutReminders} toggleWorkoutReminder={toggleWorkoutReminder}
            mealTimes={mealTimes} updateMealTime={updateMealTime} customReminders={customReminders} addCustomReminder={addCustomReminder} toggleCustomReminder={toggleCustomReminder} removeCustomReminder={removeCustomReminder}
            onBack={()=>setScreen("setup")} />
        )}
      </div>
    </div>
  );
}

function Field({label,children}){ return (<div className="mb-4"><div style={{color:C.inkSoft,fontSize:13,fontWeight:600}} className="mb-1.5">{label}</div>{children}</div>); }
const inputStyle = {width:"100%",padding:"11px 13px",borderRadius:10,border:`1.5px solid ${C.line}`,background:"#fff",color:C.ink,fontSize:15,fontFamily:FONT_BODY};
function PillGroup({options,value,onChange}){
  return (<div className="flex flex-wrap gap-2">{options.map(o=>{ const active=o.id===value;
    return (<button key={o.id} onClick={()=>onChange(o.id)} style={{padding:"8px 14px",borderRadius:999,border:`1.5px solid ${active?C.forest:C.line}`,background:active?C.forest:"#fff",color:active?"#fff":C.ink,fontSize:13.5,fontWeight:500,fontFamily:FONT_BODY,cursor:"pointer"}}>{o.label}</button>);
  })}</div>);
}

function SetupScreen({form,update,canSubmit,loading,error,onSubmit}){
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div style={{background:C.forest,padding:"26px 22px 22px"}}>
        <div style={{color:"#C9D9CF",fontSize:13,fontWeight:500}}>Set up your plan</div>
        <div style={{color:"#fff",fontFamily:FONT_HEAD,fontSize:26,lineHeight:1.15,marginTop:4}}>Tell us about you</div>
      </div>
      <div className="flex-1 overflow-y-auto px-5 pt-5 pb-4">
        <Field label="Your name"><input style={inputStyle} value={form.name} onChange={e=>update("name",e.target.value)} placeholder="e.g. Priya" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Age"><input style={inputStyle} type="number" value={form.age} onChange={e=>update("age",e.target.value)} placeholder="years" /></Field>
          <Field label="Gender"><select style={inputStyle} value={form.gender} onChange={e=>update("gender",e.target.value)}><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Height (cm)"><input style={inputStyle} type="number" value={form.height} onChange={e=>update("height",e.target.value)} placeholder="e.g. 165" /></Field>
          <Field label="Weight (kg)"><input style={inputStyle} type="number" value={form.weight} onChange={e=>update("weight",e.target.value)} placeholder="e.g. 68" /></Field>
        </div>
        <Field label="Target weight (kg) - optional"><input style={inputStyle} type="number" value={form.targetWeight} onChange={e=>update("targetWeight",e.target.value)} placeholder="e.g. 60" /></Field>
        <Field label="Goal"><PillGroup options={GOALS} value={form.goal} onChange={v=>update("goal",v)} /></Field>
        <Field label="Daily activity"><PillGroup options={ACTIVITY} value={form.activity} onChange={v=>update("activity",v)} /></Field>
        <Field label="Diet preference"><PillGroup options={DIET} value={form.diet} onChange={v=>update("diet",v)} /></Field>
        {error && <div style={{color:C.alert,fontSize:13,marginTop:4}}>{error}</div>}
      </div>
      <div style={{padding:"14px 20px 20px",background:C.bg}}>
        <button disabled={!canSubmit||loading} onClick={onSubmit} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:canSubmit?C.turmeric:C.line,color:canSubmit?C.forestDark:C.inkSoft,fontFamily:FONT_HEAD,fontSize:15,cursor:canSubmit?"pointer":"default"}}>
          {loading ? "Building your plan..." : "Generate my plan"}
        </button>
      </div>
    </div>
  );
}

function DashboardScreen(props){
  const {plan,form,tab,setTab,onBack}=props;
  if(!plan) return null;
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div style={{background:C.forest,padding:"22px 20px 18px"}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#C9D9CF",fontSize:13,padding:0,cursor:"pointer",marginBottom:10}}>&larr; Edit details</button>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
          <div>
            <div style={{color:"#fff",fontFamily:FONT_HEAD,fontSize:22}}>Hi {form.name||"there"}</div>
            <div style={{color:"#C9D9CF",fontSize:12.5,marginTop:2}}>BMI {plan.bmi} · {plan.bmiCategory}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:C.turmeric,fontFamily:FONT_HEAD,fontSize:22}}>🔥 {plan.dailyCalories}</div>
            <div style={{color:"#C9D9CF",fontSize:11.5}}>kcal / day target</div>
          </div>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto">
        {tab==="diet" && <DietTab plan={plan} {...props} />}
        {tab==="workout" && <WorkoutTab plan={plan} {...props} />}
        {tab==="progress" && <ProgressTab {...props} />}
        {tab==="premium" && <PremiumTab />}
      </div>
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

function SectionLabel({children}){ return <div style={{fontFamily:FONT_HEAD,fontSize:15,color:C.ink,margin:"18px 20px 10px"}}>{children}</div>; }

function DietTab({plan,mealReminders,toggleMealReminder,mealTimes,updateMealTime,customReminders,addCustomReminder,toggleCustomReminder,removeCustomReminder}){
  const [newLabel,setNewLabel]=useState(""); const [newTime,setNewTime]=useState("");
  return (
    <div className="pb-4">
      <div style={{margin:"16px 20px 0",background:C.card,borderRadius:14,padding:"14px 16px",display:"flex",justifyContent:"space-around"}}>
        {["protein","carbs","fat"].map(k=>(<div key={k} style={{textAlign:"center"}}><div style={{fontFamily:FONT_HEAD,fontSize:17,color:C.forest}}>{plan.macros?.[k]}g</div><div style={{fontSize:11,color:C.inkSoft,textTransform:"capitalize"}}>{k}</div></div>))}
      </div>
      <SectionLabel>Today's meals</SectionLabel>
      <div className="px-5 flex flex-col gap-2.5">
        {(plan.meals||[]).map((m,i)=>{
          const time24 = mealTimes?.[m.name] ?? to24Hour(m.time);
          const isOn = !!mealReminders?.[m.name];
          return (
            <div key={i} style={{border:`1.5px solid ${isOn?C.forest:C.line}`,borderRadius:12,padding:"12px 14px",background:"#fff"}}>
              <div className="flex items-center justify-between">
                <div style={{fontWeight:600,fontSize:14,color:C.ink}}>{m.name}</div>
                <ReminderToggle on={isOn} onClick={()=>toggleMealReminder(m.name)} />
              </div>
              <div style={{fontSize:13,color:C.inkSoft,marginTop:4,lineHeight:1.4}}>{m.items}</div>
              <div className="flex items-center justify-between" style={{marginTop:8}}>
                <div style={{fontSize:12,color:C.turmericDark,fontWeight:600}}>{m.calories} kcal</div>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:11,color:C.inkSoft}}>Alarm</span>
                  <input type="time" value={time24} onChange={e=>updateMealTime(m.name,e.target.value)} style={{border:`1.5px solid ${C.line}`,borderRadius:7,padding:"3px 6px",fontSize:12,color:isOn?C.forest:C.ink,fontFamily:FONT_BODY,background:isOn?"#EAF1EC":"#fff"}} />
                </div>
              </div>
              {isOn && <div style={{fontSize:11,color:C.forest,marginTop:5}}>Reminder set for {to12Hour(time24)}</div>}
            </div>
          );
        })}
      </div>
      <SectionLabel>Set your own reminder</SectionLabel>
      <div className="px-5">
        <div style={{border:`1.5px dashed ${C.line}`,borderRadius:12,padding:"12px 14px",display:"flex",gap:8,alignItems:"center"}}>
          <input placeholder="e.g. Drink water" value={newLabel} onChange={e=>setNewLabel(e.target.value)} style={{...inputStyle,flex:1,padding:"9px 10px",fontSize:13}} />
          <input type="time" value={newTime} onChange={e=>setNewTime(e.target.value)} style={{border:`1.5px solid ${C.line}`,borderRadius:8,padding:"8px 8px",fontSize:13,fontFamily:FONT_BODY}} />
          <button onClick={()=>{addCustomReminder(newLabel,newTime);setNewLabel("");setNewTime("");}} style={{background:C.forest,color:"#fff",border:"none",borderRadius:8,padding:"9px 12px",cursor:"pointer"}}>+</button>
        </div>
        {customReminders?.length>0 && (
          <div className="flex flex-col gap-2 mt-2.5">
            {customReminders.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:r.on?"#EAF1EC":C.card,borderRadius:10,padding:"9px 12px"}}>
                <div><div style={{fontSize:13,fontWeight:600,color:C.ink}}>{r.label}</div><div style={{fontSize:11.5,color:C.inkSoft}}>{to12Hour(r.time)}</div></div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <ReminderToggle on={r.on} onClick={()=>toggleCustomReminder(r.id)} />
                  <button onClick={()=>removeCustomReminder(r.id)} style={{background:"none",border:"none",color:C.alert,fontSize:16,cursor:"pointer"}}>×</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      {plan.tips?.length>0 && (<><SectionLabel>Quick tips</SectionLabel><div className="px-5 flex flex-col gap-2">{plan.tips.map((t,i)=>(<div key={i} style={{display:"flex",gap:8,fontSize:13,color:C.ink}}><span>✓</span><span>{t}</span></div>))}</div></>)}
    </div>
  );
}

function WorkoutTab({plan,workoutReminders,toggleWorkoutReminder}){
  return (
    <div className="pb-4">
      <SectionLabel>This week</SectionLabel>
      <div className="px-5 flex flex-col gap-3">
        {(plan.workoutDays||[]).map((d,i)=>(
          <div key={i} style={{border:`1.5px solid ${C.line}`,borderRadius:12,overflow:"hidden",background:"#fff"}}>
            <div style={{background:C.card,padding:"9px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontWeight:700,fontSize:13.5,color:C.forestDark}}>{d.day}</div><div style={{fontSize:11.5,color:C.inkSoft}}>{d.focus}</div></div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {workoutReminders?.[d.day] && <span style={{fontSize:10.5,color:C.forest}}>Reminder on</span>}
                <ReminderToggle on={!!workoutReminders?.[d.day]} onClick={()=>toggleWorkoutReminder(d.day)} />
              </div>
            </div>
            <div className="px-3.5 py-2.5 flex flex-col gap-2">
              {(d.exercises||[]).map((ex,j)=>{ const v=getExerciseVisual(ex.name);
                return (<div key={j} style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:9,background:v.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{v.emoji}</div>
                  <div style={{flex:1,display:"flex",justifyContent:"space-between"}}><span style={{color:C.ink,fontSize:13.5}}>{ex.name}</span><span style={{color:C.turmericDark,fontWeight:600,fontSize:13.5}}>{ex.sets}</span></div>
                </div>);
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function MiniLineChart({data}){
  if(!data.length) return null;
  const w=320,h=110,pad=20;
  const vals=data.map(d=>d.weight);
  const min=Math.min(...vals)-1, max=Math.max(...vals)+1;
  const pts = data.map((d,i)=>{
    const x = pad + (i*(w-2*pad))/Math.max(data.length-1,1);
    const y = h-pad - ((d.weight-min)/(max-min||1))*(h-2*pad);
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={C.forest} strokeWidth="2.5" />
      {data.map((d,i)=>{ const x=pad+(i*(w-2*pad))/Math.max(data.length-1,1); const y=h-pad-((d.weight-min)/(max-min||1))*(h-2*pad);
        return <circle key={i} cx={x} cy={y} r="3.5" fill={C.turmeric} />; })}
    </svg>
  );
}

function ProgressTab({weightLog,newWeight,setNewWeight,addWeightEntry,form}){
  const latest = weightLog[weightLog.length-1]?.weight;
  return (
    <div className="pb-4">
      <div style={{margin:"16px 20px 0",background:"#fff",border:`1.5px solid ${C.line}`,borderRadius:14,padding:"14px"}}>
        <div style={{fontSize:12.5,color:C.inkSoft,marginBottom:6}}>Weight trend {form?.targetWeight?`· target ${form.targetWeight} kg`:""}</div>
        <MiniLineChart data={weightLog} />
      </div>
      <SectionLabel>Log today's weight</SectionLabel>
      <div className="px-5 flex gap-2">
        <input style={{...inputStyle,flex:1}} type="number" placeholder={latest?`${latest} kg last logged`:"kg"} value={newWeight} onChange={e=>setNewWeight(e.target.value)} />
        <button onClick={addWeightEntry} style={{background:C.forest,color:"#fff",border:"none",borderRadius:10,padding:"0 16px",cursor:"pointer"}}>+</button>
      </div>
      <SectionLabel>History</SectionLabel>
      <div className="px-5 flex flex-col gap-1.5">
        {[...weightLog].reverse().map((w,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:13.5,padding:"9px 14px",background:C.card,borderRadius:9}}><span style={{color:C.inkSoft}}>{w.date}</span><span style={{fontWeight:600,color:C.ink}}>{w.weight} kg</span></div>))}
      </div>
    </div>
  );
}

function PremiumTab(){
  const free=["1 AI plan per month","Basic diet & workout","Manual weight log"];
  const premium=["Unlimited AI plan refreshes","Weekly adaptive diet + workout","Progress photos & measurements","1-on-1 chat with a coach","No ads"];
  return (
    <div className="px-5 pb-6 pt-4">
      <div style={{background:C.forestDark,borderRadius:16,padding:"20px 18px",color:"#fff"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}><span>👑</span><span style={{fontFamily:FONT_HEAD,fontSize:17}}>Go Premium</span></div>
        <div style={{fontSize:12.5,color:"#C9D9CF",marginTop:6,lineHeight:1.5}}>Unlock adaptive plans that update as your weight changes, plus coach support.</div>
        <div style={{display:"flex",alignItems:"baseline",gap:6,marginTop:14}}><span style={{fontFamily:FONT_HEAD,fontSize:26,color:C.turmeric}}>₹199</span><span style={{fontSize:12.5,color:"#C9D9CF"}}>/ month</span></div>
        <button style={{marginTop:14,width:"100%",background:C.turmeric,color:C.forestDark,border:"none",borderRadius:10,padding:"12px",fontFamily:FONT_HEAD,fontSize:14,cursor:"pointer"}}>Upgrade now</button>
      </div>
      <div className="grid grid-cols-2 gap-3 mt-5">
        <div><div style={{fontSize:12.5,fontWeight:700,color:C.inkSoft,marginBottom:8}}>Free</div><div className="flex flex-col gap-2">{free.map((f,i)=>(<div key={i} style={{fontSize:12,color:C.inkSoft}}>✓ {f}</div>))}</div></div>
        <div><div style={{fontSize:12.5,fontWeight:700,color:C.forest,marginBottom:8}}>Premium</div><div className="flex flex-col gap-2">{premium.map((f,i)=>(<div key={i} style={{fontSize:12,color:C.ink}}>✓ {f}</div>))}</div></div>
      </div>
    </div>
  );
}

function NavBtn({emoji,label,active,onClick}){
  return (<button onClick={onClick} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 6px",cursor:"pointer",flex:1}}>
    <span style={{fontSize:18,opacity:active?1:0.5}}>{emoji}</span>
    <span style={{fontSize:10.5,color:active?C.forest:"#A6A18E",fontWeight:active?700:500}}>{label}</span>
  </button>);
}
function BottomNav({tab,setTab}){
  return (<div style={{display:"flex",borderTop:`1.5px solid ${C.line}`,background:"#fff",padding:"4px 4px 6px"}}>
    <NavBtn emoji="🥗" label="Diet" active={tab==="diet"} onClick={()=>setTab("diet")} />
    <NavBtn emoji="🏋️" label="Workout" active={tab==="workout"} onClick={()=>setTab("workout")} />
    <NavBtn emoji="📈" label="Progress" active={tab==="progress"} onClick={()=>setTab("progress")} />
    <NavBtn emoji="👑" label="Premium" active={tab==="premium"} onClick={()=>setTab("premium")} />
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<FitnessApp />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
